<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pivot</title>
<!-- Pivot の入口。Google の外に置いたこのページの中で Pivot（Apps Script）を開く。
     中の Google のページにはこの端末の Google ログインが届かないので、ログインしたままのブラウザでも開ける。
     ホーム画面のアイコンと名前もここで決める。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pivot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBE7E1">
<style>
  html, body { margin: 0; height: 100%; background: #FBE7E1; }
  /* 拡大できないようにする（ダブルタップで拡大しない・文字を勝手に大きくしない） */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  /* 通知の許可（中の Pivot から頼まれたときだけ出す。iPhone では、このページで押さないと許可の画面が出ない） */
  .ask { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 10; background: #fff; color: #333;
    border-radius: 18px; padding: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.25); font: 15px/1.6 system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; max-width: 480px; margin: 0 auto; }
  .ask[hidden] { display: none; }
  .ask .row { display: flex; gap: 10px; justify-content: flex-end; }
  .ask button { font: 600 15px system-ui, sans-serif; border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; }
  .ask .yes { background: #5E9E86; color: #fff; }
  .ask .no { background: #eee; color: #333; }
  .wait { position: fixed; inset: 0; display: grid; place-items: center; font: 600 15px/1.6 system-ui, sans-serif; color: #5E9E86; }
</style>
<script>
// 読み込み中の背景も、前に開いたときの Pivot の色にする（中の Pivot が pivotColors で知らせてくる。なければ上の色のまま）
(function () {
  var c = null; try { c = (localStorage.getItem("pivot_colors") || "").split(","); } catch (e) {}
  var ok = function (v) { return /^#[0-9a-fA-F]{6}$/.test(v || ""); };
  if (!c || !ok(c[0]) || !ok(c[1])) return;
  var st = document.createElement("style");
  st.textContent = "html, body { background: " + c[0] + "; } .wait { color: " + c[1] + "; }";
  document.head.appendChild(st);
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", c[0]);
})();
</script>
</head>
<body>
<div class="wait" id="wait">Pivot を開いています…</div>
<div class="ask" id="ask" hidden role="dialog" aria-label="通知を受け取る">
  <div><b>Pivot の通知を受け取りますか？</b><br>ゴミの日・依頼箱の返事・経費のチェックをお知らせします。下のボタンを押して、次に出る画面で「許可」を選んでください。</div>
  <div class="row"><button type="button" class="no" id="askNo">やめる</button><button type="button" class="yes" id="askYes">通知を受け取る</button></div>
</div>
<script>
// 公開している Pivot（Apps Script）の URL
const APP = "https://script.google.com/macros/s/AKfycbyulcJHv9hNRmHVooER51Bk0N5sYTL_-KQ6QkFndalTs9HCGNTplMavNr86ESxKSICH/exec";
// この端末の鍵：URL の ?k= か、前に保存したもの。あれば中の Pivot に渡すのでパスワードが要らない
const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
const set = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
const qs = new URLSearchParams(location.search), fromUrl = qs.get("k");
// 通知を押して開いたとき（?open=kc-…）：中の Pivot の用意ができたら、それを開いてもらう
const OPEN_RE = /^[a-z]{2,8}-[A-Za-z0-9_]{1,40}$/;
let openNext = OPEN_RE.test(qs.get("open") || "") ? qs.get("open") : "";
if (fromUrl) set("pivot_key", fromUrl);
if (fromUrl || qs.has("open")) history.replaceState(null, "", location.pathname);
const key = fromUrl || get("pivot_key");

const f = document.createElement("iframe");
f.title = "Pivot";
f.allow = "clipboard-write";
f.src = APP + (key ? "?k=" + encodeURIComponent(key) : "");
f.onload = () => document.getElementById("wait").remove();
document.body.append(f);

// 拡大できないようにする（iPhone は user-scalable=no を無視するので、ピンチをここでも止める）
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, ev => ev.preventDefault(), { passive: false }));
document.addEventListener("touchmove", ev => { if (ev.touches.length > 1 && ev.cancelable) ev.preventDefault(); }, { passive: false });

// ---- 通知（Web Push）。サービスワーカー（sw.js）はこのフォルダに置く ----
// 許可と購読はこのページ（いちばん外）でしかできないので、中の Pivot に頼まれたらここでボタンを出す
const pushOk = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let swReg = null;
const swReady = pushOk ? navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(r => (swReg = r)).catch(() => null) : Promise.resolve(null);
const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const fromB64u = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); const b = atob(s + "===".slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
const toB64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const hashOf = async ep => toB64u(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(ep)));
const sameKey = (sub, key) => { try { const a = new Uint8Array(sub.options.applicationServerKey), b = fromB64u(key); return a.length === b.length && a.every((x, i) => x === b[i]); } catch { return false; } };
async function pushState() {
  const st = { supported: pushOk, standalone, ios: isIOS, permission: pushOk ? Notification.permission : "unsupported", sub: null, hash: "" };
  if (pushOk) {
    const reg = await swReady, sub = reg && await reg.pushManager.getSubscription();
    if (sub) { st.sub = sub.toJSON(); st.hash = await hashOf(sub.endpoint); }
  }
  return st;
}
async function onPush(src, origin, d) {
  const reply = o => { try { src.postMessage(Object.assign({ pivotPushReply: 1, rid: d.rid }, o), origin); } catch {} };
  if (d.pivotPush === "state") return reply({ state: await pushState() });
  if (d.pivotPush === "off") {
    let hash = "";
    try { const reg = await swReady, sub = reg && await reg.pushManager.getSubscription(); if (sub) { hash = await hashOf(sub.endpoint); await sub.unsubscribe(); } } catch {}
    return reply({ hash });
  }
  if (d.pivotPush !== "ask" || !/^[A-Za-z0-9_-]{80,100}$/.test(String(d.key || ""))) return;
  if (!pushOk) return reply({ error: "unsupported" });
  const reg = await swReady;
  if (!reg) return reply({ error: "サービスワーカーを準備できませんでした" });
  const old = await reg.pushManager.getSubscription();
  const box = document.getElementById("ask");
  const done = async (p, isNew) => {
    try {
      const sub = await p;
      reply({ sub: sub.toJSON(), hash: await hashOf(sub.endpoint), isNew });
    } catch (e) { reply({ error: Notification.permission === "denied" ? "denied" : String((e && e.message) || e) }); }
  };
  document.getElementById("askNo").onclick = () => { box.hidden = true; reply({ cancel: true }); };
  document.getElementById("askYes").onclick = () => {
    box.hidden = true;
    const opt = { userVisibleOnly: true, applicationServerKey: fromB64u(d.key) };
    if (old && sameKey(old, d.key)) return done(Promise.resolve(old), false);
    // 押したその場で subscribe を呼ぶ（許可の画面もここで出る。iPhone は押した直後でないと出せない）
    if (!old) return done(reg.pushManager.subscribe(opt), true);
    done(old.unsubscribe().then(() => reg.pushManager.subscribe(opt)), true);  // 鍵が変わっていたら作り直す
  };
  box.hidden = false;
}

// 通知を押したとき、もう開いていた Pivot には、サービスワーカーが「これを開いて」と知らせてくる
// 中の Pivot（最後に話しかけてきた枠）に渡す。まだ用意ができていなければ、聞かれたときに渡す
let app = null;
const sendOpen = () => { if (openNext && app) { try { app.win.postMessage({ pivotOpen: openNext }, app.origin); openNext = ""; } catch {} } };
if (pushOk) navigator.serviceWorker.addEventListener("message", ev => {
  const v = ev.data && ev.data.pivotOpen;
  if (typeof v === "string" && OPEN_RE.test(v)) { openNext = v; sendOpen(); }
});
// 中の Pivot が「新しい鍵ができた／ログアウトした」「色が変わった」と知らせてきたら覚え直す
addEventListener("message", ev => {
  if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(ev.origin)) return;
  const d = ev.data || {};
  if (ev.source) app = { win: ev.source, origin: ev.origin };
  // 中の Pivot が開き終わって「開くものはある？」と聞いてきた
  if (d.pivotOpen === "get") { try { ev.source.postMessage({ pivotPushReply: 1, rid: d.rid, open: openNext }, ev.origin); } catch {} openNext = ""; return; }
  if (d.pivotPush) { onPush(ev.source, ev.origin, d); return; }
  if (d.pivotKey !== undefined) set("pivot_key", d.pivotKey || null);
  if (typeof d.pivotColors === "string" && /^#[0-9a-fA-F]{6},#[0-9a-fA-F]{6}$/.test(d.pivotColors)) set("pivot_colors", d.pivotColors);
});
</script>
</body>
</html>
